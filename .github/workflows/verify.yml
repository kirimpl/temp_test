name: Verify VAYRHEX
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check atlas-v08.js
          node --check visual-v09.js
          node --check visual-v10.js
      - name: Check static site files
        run: |
          test -s index.html
          test -s ui-v03.css
          test -s atlas-v08.css
          test -s game.js
          test -s atlas-v08.js
          test -s visual-v09.css
          test -s visual-v09.js
          test -s visual-v10.js
          test -s ui-v10.css
          test -s assets/art/hero-scene.svg
          test -s assets/art/tower-pulse.svg
          test -s assets/art/tower-ember.svg
          test -s assets/art/tower-frost.svg
          test -s assets/art/tower-arc.svg
          test -s assets/art/tower-rail.svg
          test -s assets/ui/button-primary.png
          grep -q 'href="ui-v03.css"' index.html
          grep -q 'src="game.js"' index.html
          grep -q 'src="atlas-v08.js"' index.html
          grep -q 'href="atlas-v08.css"' index.html
          grep -q 'id="atlasViewport"' index.html

          grep -q 'src="visual-v09.js"' index.html
          grep -q 'href="visual-v09.css"' index.html
          grep -q 'href="ui-v10.css"' index.html
          grep -q 'src="visual-v10.js"' index.html
      - name: Validate SVG artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for file in Path('assets/art').glob('*.svg'):
              ElementTree.parse(file)
          PY
