name: Verify COREBOUND
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Check static site files
        run: |
          test -s index.html
          test -s styles.css
          test -s game.js
          grep -q 'href="styles.css"' index.html
          grep -q 'src="game.js"' index.html
